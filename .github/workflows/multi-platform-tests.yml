name: Multi-Platform Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          pip install pytest

      - name: Sanity check - core imports
        run: |
          python -c "from streamctx.storage import get_storage; print('storage OK')"
          python -c "from streamctx.tracker import get_tracker; print('tracker OK')"
          python -c "from streamctx.attribution import get_attribution_engine; print('attribution OK')"
          python -c "from streamctx.replay import get_replayer; print('replay OK')"
          python -c "from streamctx.compressor import compress_messages; print('compressor OK')"

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Report platform info on failure
        if: failure()
        run: python -c "import platform; print(platform.platform()); print(platform.python_version())"

